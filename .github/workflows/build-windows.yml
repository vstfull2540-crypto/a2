
name: Build LA-2A Classic (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VST3 and Standalone
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Standalone
        run: >
          cmake --build build
          --config Release
          --target LA2AClassic_VST3 LA2AClassic_Standalone
          --parallel

      - name: Verify VST3 output exists
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path "build" `
            -Recurse -Directory `
            -Filter "LA-2A Classic.vst3" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $vst3) {
            Write-Error "VST3 bundle was not found."
            Get-ChildItem -Path "build" -Recurse |
              Select-Object -ExpandProperty FullName
            exit 1
          }

          Write-Host "Found VST3: $($vst3.FullName)"

          $module = Get-ChildItem -Path $vst3.FullName `
            -Recurse -File -Filter "*.vst3" `
            -ErrorAction SilentlyContinue

          if (-not $module) {
            $module = Get-ChildItem -Path $vst3.FullName `
              -Recurse -File -Filter "*.dll" `
              -ErrorAction SilentlyContinue
          }

          if (-not $module) {
            Write-Error "VST3 bundle has no plugin binary."
            exit 1
          }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-2A-Classic-VST3-Windows-x64
          path: build/**/LA-2A Classic.vst3/**
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-2A-Classic-Standalone-Windows-x64
          path: build/**/LA-2A Classic.exe
          if-no-files-found: warn
          retention-days: 14
